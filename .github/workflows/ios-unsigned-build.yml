name: Build Unsigned iOS App (IPA)

on:
  workflow_dispatch: # Permite ejecutar este flujo manualmente desde la página web de GitHub

jobs:
  build-ios:
    name: Build Unsigned iOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Build Web App (Vite)
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build Unsigned iOS App (.app)
        run: |
          cd ios/App
          # Usamos el compilador de Apple (xcodebuild) pero le forzamos a apagar todas las validaciones de firma
          xcodebuild -workspace App.xcworkspace \
                     -scheme App \
                     -configuration Release \
                     -destination generic/platform=iOS \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_ENTITLEMENTS="" \
                     CODE_SIGNING_ALLOWED=NO \
                     CONFIGURATION_BUILD_DIR=$(pwd)/build \
                     build

      - name: Package .app into .ipa
        run: |
          cd ios/App/build/Release-iphoneos
          # Un archivo .ipa en realidad es solo una carpeta llamada "Payload" comprimida en un ZIP
          mkdir Payload
          cp -R App.app Payload/
          zip -qr AsicmeChat.ipa Payload

      - name: Upload IPA to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: AsicmeChat-iOS-Unsigned
          path: ios/App/build/Release-iphoneos/AsicmeChat.ipa
          retention-days: 7
